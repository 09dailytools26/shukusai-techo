<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="only light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>宿題手帳</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="宿題手帳">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f3f5f9">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  color-scheme:only light;
  --bg:#f3f5f9; --surface:#ffffff; --surface2:#e9edf4; --ink:#141b2e; --ink2:#586079; --line:#d9dfea;
  --accent:#16213e; --onaccent:#ffffff;
  --c-math:#1f6fd1; --c-jp:#d9363e; --c-sci:#ee8412; --c-soc:#2c9a52; --c-piano:#7b55c9; --c-life:#15939e; --c-other:#6b7389;
  --t-math:#e6effb; --t-jp:#fbe8e9; --t-sci:#fdf0e1; --t-soc:#e5f4ea; --t-piano:#efe9f9; --t-life:#e2f3f4; --t-other:#eceef3;
  --g-normal:#586079; --g-test:#c2410c; --g-0:#4338ca; --g-1:#be185d; --g-2:#8a5a12; --g-3:#0f766e; --g-4:#6d28d9;
  --stamp:#c8262e; --warn:#c2410c; --warn-bg:#fff1e6;
  --radius:12px;
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button,select,input,label{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:active{opacity:.75}
body{margin:0;background:var(--bg);color:var(--ink);font-family:inherit;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--c-math);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px calc(160px + env(safe-area-inset-bottom,0px))}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{padding-block:18px 6px;display:flex;flex-direction:column;gap:12px}
.dayline{display:flex;align-items:center;gap:10px}
.navbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1;display:grid;place-items:center;flex:none}
.date{flex:1;min-width:0}
.date h1{margin:0;font-size:clamp(24px,6.5vw,32px);font-weight:900;letter-spacing:.01em;line-height:1.2}
.date .sub{font-size:14px;color:var(--ink2);display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:2px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:1px 10px;border-radius:6px;border:1.5px solid currentColor;line-height:1.6}
.badge::before{content:"";width:7px;height:7px;border-radius:2px;background:currentColor}
.todaybtn{border:0;background:var(--accent);color:var(--onaccent);border-radius:6px;padding:2px 12px;font-size:13px;font-weight:700}

/* progress */
.prog{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.prog .row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.prog .big{font-size:30px;font-weight:900;line-height:1}
.prog .big small{font-size:14px;font-weight:700;color:var(--ink2);margin-left:4px}
.prog .rest{font-weight:700;color:var(--ink2);font-size:14px;text-align:right}
.bar{display:flex;height:10px;border-radius:3px;background:var(--surface2);overflow:hidden;gap:2px}
.bar span{display:block;height:100%}
.stamp{position:absolute;right:16px;top:50%;transform:translateY(-50%) rotate(-10deg);border:3px double var(--stamp);color:var(--stamp);border-radius:50%;width:78px;height:78px;display:grid;place-items:center;text-align:center;font-weight:900;font-size:22px;letter-spacing:.1em;opacity:.92;animation:stampin .3s ease-out}
@keyframes stampin{from{transform:translateY(-50%) rotate(-10deg) scale(1.5);opacity:0}}
@media (prefers-reduced-motion:reduce){.stamp{animation:none}}

/* sections */
h2.sec{font-size:17px;font-weight:900;margin:24px 0 10px;display:flex;align-items:baseline;gap:10px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
h2.sec .cnt{font-size:13px;color:var(--ink2);font-weight:700}
.group{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.ghead{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--ink2)}
.tag{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:5px;color:#fff;font-weight:900;font-size:14px;flex:none}
.tag.sm{width:21px;height:21px;font-size:12px;border-radius:4px}
.task{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:56px}
.task .spine{width:6px;flex:none}
.task .main{flex:1;display:flex;align-items:center;gap:12px;padding:9px 12px;border:0;background:none;text-align:left;min-width:0}
.check{width:28px;height:28px;border-radius:6px;border:2.5px solid currentColor;flex:none;display:grid;place-items:center;font-size:16px;font-weight:900}
.task .txt{min-width:0;display:flex;flex-direction:column}
.task .name{font-weight:700;font-size:16px;color:var(--ink);overflow-wrap:anywhere}
.task .memo{font-size:13px;color:var(--ink2);overflow-wrap:anywhere}
.task .more{border:0;border-left:1px solid var(--line);background:none;width:44px;flex:none;color:var(--ink2);font-size:18px}
.due{font-size:12px;font-weight:700;border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:2px;border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.due.today{background:none;border-color:var(--g-0);color:var(--g-0)}
.due.late{background:none;border-color:var(--c-jp);color:var(--c-jp)}
.dueonly{font-size:12px;color:var(--ink2);margin-top:4px}
.xtra{font-size:11px;font-weight:700;color:var(--ink2);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:2px}
.moremenu{display:flex;gap:8px;flex-wrap:wrap;padding:0 4px 4px 16px}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:14px;font-weight:700}
.chipbtn.danger{color:var(--c-jp);border-color:var(--c-jp)}
.donelist{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 0}
.donelist button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:8px 14px;font-size:15px}
.donelist .dot{width:21px;height:21px;border-radius:4px;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:900;flex:none}
.donelist .nm{flex:1;min-width:0;color:var(--ink2);overflow-wrap:anywhere;text-decoration:line-through;text-decoration-color:var(--line)}
.donelist .undo{font-size:12px;color:var(--ink2);border:1px solid var(--line);border-radius:5px;padding:0 6px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:16px;text-align:center;color:var(--ink2);font-size:15px}
.addbtn{width:100%;border:1.5px dashed var(--line);background:none;border-radius:10px;padding:11px;font-weight:700;color:var(--ink2);margin-top:4px}
.addbtn.solid{border-style:solid;background:var(--surface)}
.skipped{display:flex;flex-wrap:wrap;gap:6px}

/* week */
.dayblock{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
.dayblock .dh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 14px;background:var(--surface2);font-weight:700;font-size:15px}
.dayblock.over .dh{background:var(--warn-bg);color:var(--warn)}
.dayblock.istoday .dh{background:var(--accent);color:var(--onaccent)}
.dayblock ul{list-style:none;margin:0;padding:4px 0}
.dayblock li{display:flex;align-items:center;gap:10px;padding:6px 14px;font-size:15px}
.dayblock li .nm{flex:1;min-width:0;overflow-wrap:anywhere;color:var(--ink)}
.dayblock li .memo{color:var(--ink2);font-size:13px}
.minicheck{width:24px;height:24px;border-radius:5px;border:2.5px solid currentColor;background:none;flex:none;padding:0}
.allgood{padding:8px 14px;color:var(--ink2);font-size:14px}
.gridwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table.grid{border-collapse:collapse;width:100%;min-width:540px;font-size:14px}
.grid th,.grid td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line)}
.grid th:first-child,.grid td:first-child{text-align:left;padding-left:12px;position:sticky;left:0;background:var(--surface);min-width:150px;max-width:190px}
.grid thead th{font-weight:700;color:var(--ink2);font-size:13px;line-height:1.3}
.grid thead th.td{color:var(--ink);background:var(--surface2)}
.grid .tn{display:flex;align-items:center;gap:6px}
.grid .tn span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell{width:24px;height:24px;border-radius:5px;border:2.5px solid currentColor;display:inline-grid;place-items:center;background:none;padding:0;font-size:13px;font-weight:900}
.cell.on,.minicheck.on{background:currentColor}
.cell.on::after{content:"✓";color:var(--surface)}
.cell.late{border-style:dashed}
.grid tfoot td{font-weight:700;color:var(--ink2);border-bottom:0}
.selrow{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:700}
select.gsel{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-weight:700;max-width:60%}

/* settings */
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-weight:700;font-size:14px;color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.seg button .sw{width:9px;height:9px;border-radius:2px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.hint{font-size:13px;color:var(--ink2);margin:8px 2px}
.srow{display:flex;align-items:center;gap:10px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left}
.srow .txt{flex:1;min-width:0}
.srow .name{font-weight:700;overflow-wrap:anywhere}
.srow .memo{font-size:13px;color:var(--ink2)}
.dows{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px}
.dows i{font-style:normal;font-size:12px;width:22px;height:22px;border-radius:4px;display:grid;place-items:center;background:var(--surface2);color:var(--ink2);opacity:.45}
.dows i.on{opacity:1;color:#fff;font-weight:700}
.also{font-size:12px;color:var(--ink2);margin-left:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.weeklist{display:flex;flex-direction:column}
.weeklist .wr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.weeklist .wr:last-child{border-bottom:0}
.weeklist .wr .l{display:flex;align-items:center;gap:8px;min-width:0}
.weeklist .wr .now{font-size:11px;font-weight:700;background:var(--accent);color:var(--onaccent);border-radius:4px;padding:0 5px}
.grouplist{display:flex;flex-direction:column;gap:6px}
.grow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.grow .sw{width:14px;height:14px;border-radius:3px;flex:none}
.grow .nm{flex:1;font-weight:700;min-width:0;overflow-wrap:anywhere}
.grow .cnt{font-size:13px;color:var(--ink2)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label,.field>.lb{font-weight:700;font-size:14px}
.field input[type=text],.field input[type=date],.field select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;font-size:16px;width:100%}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.frow{grid-template-columns:1fr}}
.pickrow{display:flex;flex-wrap:wrap;gap:6px}
.pick{border:2px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.pick[aria-pressed="true"]{border-color:currentColor}
.pick.dw{width:42px;justify-content:center;padding:6px 0}
.pick.dw[aria-pressed="true"],.pick.wn[aria-pressed="true"]{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.note{font-size:13px;color:var(--ink2);margin-top:10px}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:700;font-size:15px;background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--onaccent)}
.btn.danger{background:none;color:var(--c-jp);border:1px solid var(--c-jp)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btns .grow1{flex:1}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:4px;z-index:5}
.tabs button{flex:1;max-width:200px;border:0;background:none;border-radius:10px;padding:7px 4px;font-weight:700;font-size:13px;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--ink);background:var(--surface2)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,14,28,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:600px){.overlay{align-items:center}.sheet{border-radius:16px}}
.sheet h3{margin:0 0 14px;font-size:19px;font-weight:900}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--accent);color:var(--onaccent);padding:9px 18px;border-radius:8px;font-weight:700;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.setup{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-top:24px}
.setup h2{margin:0 0 8px;font-size:20px}
[hidden]{display:none!important}
.cal{margin-bottom:12px}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.calh b{font-size:16px}
.navbtn.sm{width:36px;height:36px;font-size:18px}
.calg{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px}
.cw{text-align:center;font-size:12px;color:var(--ink2);padding:2px 0 4px}
.cd{position:relative;border:0;background:none;height:42px;font-size:15px;font-variant-numeric:tabular-nums;color:var(--ink);padding:0}
.cd.out{opacity:.4}
.cd.sel{background:var(--surface2)}
.cd.edge{background:var(--accent);color:var(--onaccent);border-radius:8px}
.cd.today{font-weight:900}
.cd.today::after{content:"";position:absolute;left:30%;right:30%;top:5px;height:2px;background:currentColor;border-radius:2px}
.cd i{position:absolute;left:50%;bottom:5px;width:6px;height:6px;border-radius:50%;transform:translateX(-50%)}
.calsel{margin:8px 2px 0;font-weight:700;font-size:15px}
.setcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:4px}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--warn-bg);color:var(--ink);border:1px solid var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:12px}
.banner b{color:var(--warn)}
.banner .btn{padding:6px 12px;font-size:13px;flex:none}
.linkrow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-weight:700;text-decoration:none;color:var(--ink)}
</style>
</head>
<body>
<div class="wrap" id="main"></div>
<nav class="tabs" id="tabs"></nav>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
(function(){
"use strict";
/* ---------- constants ---------- */
const SUBJ = {
  math:{name:"算数",short:"算"}, jp:{name:"国語",short:"国"}, sci:{name:"理科",short:"理"}, soc:{name:"社会",short:"社"},
  piano:{name:"習い事",short:"習"}, life:{name:"生活",short:"生"}, other:{name:"その他",short:"他"}
};
const ORDER = ["math","jp","sci","soc","piano","life","other"];
const DOW = ["日","月","火","水","木","金","土"];
const ALWAYS = "always";
const col = s => `var(--c-${s})`;
const tint = s => `var(--t-${s})`;
const KEY = "shukudai-techo-v2";

/* 例のデータ（「例を入れて始める」を選んだときだけ使う） */
const A=[0,1,2,3,4,5,6], WK=[1,2,3,4,5,6];
function sampleData(){
  const ws = weekStartOf(todayISO(),1);
  return {
    childName:"", weekStart:1, lastBackupISO:"",
    groups:[
      {id:"normal",name:"通常週",color:"normal",builtin:true},
      {id:"test",name:"テスト週",color:"test",builtin:true},
      {id:"gwinter",name:"冬期講習（例）",color:"0"}
    ],
    weekGroups:{ [addDays(ws,28)]:"test" },
    tasks:[
      {id:"c1",subject:"math",name:"計算①（例）",memo:"",days:[1],groups:[ALWAYS]},
      {id:"c2",subject:"math",name:"計算②（例）",memo:"",days:[2],groups:[ALWAYS]},
      {id:"c3",subject:"math",name:"計算③（例）",memo:"",days:[3],groups:[ALWAYS]},
      {id:"c4",subject:"math",name:"計算④（例）",memo:"",days:[4],groups:[ALWAYS]},
      {id:"c5",subject:"math",name:"計算⑤（例）",memo:"",days:[5],groups:[ALWAYS]},
      {id:"c6",subject:"math",name:"計算⑥（例）",memo:"",days:[6],groups:[ALWAYS]},
      {id:"c7",subject:"math",name:"計算⑦（例）",memo:"",days:[0],groups:[ALWAYS]},
      {id:"s2",subject:"math",name:"基礎問題集（例）",memo:"",days:[1,3,5],groups:["normal"]},
      {id:"s3",subject:"math",name:"演習テキスト（例）",memo:"授業の単元",days:[2,4],groups:["normal"]},
      {id:"s4",subject:"jp",name:"漢字練習（例）",memo:"1回分",days:[1,2,4,5],groups:["normal","gwinter"]},
      {id:"s5",subject:"jp",name:"国語テキスト（例）",memo:"",days:[3,6],groups:["normal"]},
      {id:"s6",subject:"sci",name:"理科まとめ問題（例）",memo:"",days:[2,5],groups:["normal"]},
      {id:"s7",subject:"soc",name:"社会まとめ問題（例）",memo:"",days:[3,6],groups:["normal"]},
      {id:"s16",subject:"sci",name:"理科 確認テスト直し（例）",memo:"曜日は自由",mode:"due",due:5,days:[],groups:["normal"]},
      {id:"t1",subject:"math",name:"算数 問題集（例）",memo:"テスト範囲の単元",days:[1,2,3,4],groups:["test"]},
      {id:"t2",subject:"math",name:"算数 間違えた問題の解き直し（例）",memo:"",days:[5],groups:["test"]},
      {id:"t3",subject:"jp",name:"漢字の復習（例）",memo:"テスト範囲の回",days:[1,3,5],groups:["test"]},
      {id:"t4",subject:"jp",name:"国語 問題集（例）",memo:"",days:[2,4],groups:["test"]},
      {id:"t5",subject:"sci",name:"理科 問題集（例）",memo:"",days:[2,4],groups:["test"]},
      {id:"t6",subject:"sci",name:"理科 暗記の確認（例）",memo:"",days:[5],groups:["test"]},
      {id:"t7",subject:"soc",name:"社会 問題集（例）",memo:"",days:[1,3],groups:["test"]},
      {id:"t8",subject:"soc",name:"社会 暗記の確認（例）",memo:"",days:[5],groups:["test"]},
      {id:"s15",subject:"math",name:"講習テキスト復習（例）",memo:"",days:A,groups:["gwinter"]},

/* ---------- date helpers ---------- */
function pad(n){ return String(n).padStart(2,"0"); }
function iso(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function parse(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function addDays(s,n){ const d=parse(s); d.setDate(d.getDate()+n); return iso(d); }
function dow(s){ return parse(s).getDay(); }
function todayISO(){ return iso(new Date()); }
function md(s){ const d=parse(s); return `${d.getMonth()+1}/${d.getDate()}`; }
function weekStartOf(s,ws){ return addDays(s, -((dow(s)-ws+7)%7)); }
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => (p||"t")+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

  catch(e){ storageOK = false; return null; }

function persist(){

  catch(e){ storageOK = false; toast("保存できませんでした。ブラウザの設定を確認してください"); }

function normalize(d){
  d = d||{};
  d.groups = Array.isArray(d.groups)&&d.groups.length ? d.groups : blankData().groups;
  if (!d.groups.find(g=>g.id==="normal")) d.groups.unshift({id:"normal",name:"通常週",color:"normal",builtin:true});
  d.weekGroups = d.weekGroups||{};
  d.tasks = Array.isArray(d.tasks)?d.tasks:[];
  d.tasks.forEach(t=>{ if(!Array.isArray(t.groups)||!t.groups.length) t.groups=[ALWAYS]; if(!Array.isArray(t.days)) t.days=[]; });
  d.days = d.days||{};
  d.tasks.forEach(t=>{ if(t.mode!=="due") t.mode="days"; });
  d.weekStart = [0,1,2,3,4,5,6].includes(d.weekStart) ? d.weekStart : 1;
  d.dues = d.dues||{};
  if (!d.duesV2){
    // 旧形式（週の始まりの日付ごと）→ 新形式（期限の日付ごと）に移す
    Object.keys(d.weeks||{}).forEach(ws=>{
      const w=d.weeks[ws]||{};
      const move=(id)=>{ const t=d.tasks.find(x=>x.id===id&&x.mode==="due"); if(!t) return null; const dd=addDays(ws,((t.due-dow(ws))+7)%7); d.dues[dd]=d.dues[dd]||{done:{},skip:[]}; return dd; };
      Object.keys(w.done||{}).forEach(id=>{ const dd=move(id); if(dd) d.dues[dd].done[id]=w.done[id]; });
      (w.skip||[]).forEach(id=>{ const dd=move(id); if(dd && !d.dues[dd].skip.includes(id)) d.dues[dd].skip.push(id); });
    });
    d.duesV2=true;
  }
  delete d.weeks;
  d.childName = d.childName||"";
  d.lastBackupISO = d.lastBackupISO||"";
  if (!d.startISO){ const ks=Object.keys(d.days).sort(); d.startISO = ks[0] && ks[0]<todayISO() ? ks[0] : todayISO(); }
  delete d.lastBackup;
  return d;
}

function daysSince(isoDate){ return isoDate ? Math.round((parse(todayISO())-parse(isoDate))/86400000) : null; }

/* ---------- derive ---------- */
const gById = id => data.groups.find(g=>g.id===id);
const gColor = g => `var(--g-${g?g.color:"normal"})`;
function groupOf(date){ const g = data.weekGroups[weekStartOf(date,data.weekStart)]; return gById(g)?g:"normal"; }
function badge(gid){ const g=gById(gid)||gById("normal"); return `<span class="badge" style="color:${gColor(g)}">${esc(g.name)}</span>`; }
function getDay(date){ const d=data.days[date]; return {done:(d&&d.done)||{}, extra:(d&&d.extra)||[], skip:(d&&d.skip)||[]}; }
function dayRef(date){ if(!data.days[date]) data.days[date]={done:{},extra:[],skip:[]}; const d=data.days[date]; d.done=d.done||{}; d.extra=d.extra||[]; d.skip=d.skip||[]; return d; }
function orderIdx(t){ const i=data.tasks.findIndex(x=>x.id===t.id); return i<0?999:i; }
function sortTasks(list){ return list.sort((a,b)=>ORDER.indexOf(a.subject)-ORDER.indexOf(b.subject) || orderIdx(a)-orderIdx(b)); }
function tasksFor(date){
  const w = dow(date), g = groupOf(date), d = getDay(date), skip = new Set(d.skip);
  const base = data.tasks.filter(t=>t.mode!=="due" && t.days.includes(w) && (t.groups.includes(ALWAYS) || t.groups.includes(g)));
  const all = sortTasks([...base, ...d.extra.map(x=>Object.assign({},x,{extra:true}))]);
  const active = all.filter(t=>!skip.has(t.id));
  return { active, skipped: base.filter(t=>skip.has(t.id)), done: active.filter(t=>d.done[t.id]), todo: active.filter(t=>!d.done[t.id]) };
}
/* 期限つき（曜日は自由・○曜日までにする）課題
   1回分の期間 ＝ 前の期限の翌日 〜 期限の日。記録は期限の日付ごとに持つ */
function dueRef(dd){ if(!data.dues[dd]) data.dues[dd]={done:{},skip:[]}; const w=data.dues[dd]; w.done=w.done||{}; w.skip=w.skip||[]; return w; }
function nextDue(t,date){ return addDays(date,((t.due-dow(date))+7)%7); }
function dueInst(t,dd){ const r=data.dues[dd]||{}; return Object.assign({},t,{dueDate:dd, ws:dd, doneDate:(r.done||{})[t.id]||"", skipped:(r.skip||[]).includes(t.id)}); }
function dueApplies(t,dd){ const g=groupOf(dd); return t.groups.includes(ALWAYS)||t.groups.includes(g); }
/* date 以降で最初に来る期限の回（週の画面では週の初日を渡すと、その週に期限がある回になる） */
function dueFor(date){
  const list = sortTasks(data.tasks.filter(t=>t.mode==="due").map(t=>dueInst(t,nextDue(t,date))).filter(t=>dueApplies(t,t.dueDate)));
  return { all:list.filter(t=>!t.skipped), skipped:list.filter(t=>t.skipped), pending:list.filter(t=>!t.skipped&&!t.doneDate) };
}
function dueLabel(t,ref){
  const wd = DOW[dow(t.dueDate)]+"曜";
  if (t.doneDate) return `<span class="due">${wd}まで</span>`;
  if (ref>t.dueDate) return `<span class="due late">期限切れ（${wd}まで）</span>`;
  if (ref===t.dueDate) return `<span class="due today">今日まで</span>`;
  return `<span class="due">${wd}まで</span>`;
}
function dateTitle(s){ const d=parse(s); return `${d.getMonth()+1}月${d.getDate()}日（${DOW[d.getDay()]}）`; }

/* 前の日までに終わらなかった課題（最大7日前まで）を「期限切れ」として持ち越す。生活は持ち越さない */
function carryFor(today){
  const from = [addDays(today,-7), data.startISO].sort()[1];
  const items=[], doneToday=[];
  for (let d=from; d<today; d=addDays(d,1)){
    const T=tasksFor(d), day=getDay(d);
    T.todo.filter(t=>t.subject!=="life").forEach(t=>items.push(Object.assign({},t,{orig:d})));
    T.done.forEach(t=>{ if(day.done[t.id]===today) doneToday.push(Object.assign({},t,{orig:d})); });
  }
  data.tasks.filter(t=>t.mode==="due").forEach(t=>{
    const prev = addDays(nextDue(t,today),-7);
    if (prev < data.startISO || !dueApplies(t,prev)) return;
    const x = dueInst(t,prev);
    if (x.skipped) return;
    if (!x.doneDate && t.subject!=="life") items.push(Object.assign(x,{orig:prev}));
    else if (x.doneDate===today) doneToday.push(Object.assign(x,{orig:prev}));
  });
  items.sort((a,b)=>a.orig<b.orig?-1:a.orig>b.orig?1:0);
  return {items, doneToday};
}

function weekHTML(){
  const today = todayISO();

  const per = dates.map(d=>({d, T:tasksFor(d)}));

  const lateDue = t => !t.doneDate && t.dueDate<today && t.dueDate>=data.startISO;
  const remaining = per.filter(p=>p.d>=today).reduce((a,p)=>a+p.T.todo.length,0);
  const late = p => p.d<today && p.d>=data.startISO;
  const overdue = per.filter(late).reduce((a,p)=>a+p.T.todo.length,0) + D.pending.filter(lateDue).length;

  const doneAll = per.reduce((a,p)=>a+p.T.done.length,0) + D.all.filter(t=>t.doneDate).length, totalAll = per.reduce((a,p)=>a+p.T.active.length,0) + D.all.length;

  h += `<h2 class="sec">今週の残り</h2>`;
  if (D.pending.length){
    const doneDay = today>=ws && today<=we ? today : null;
    h += `<div class="dayblock${D.pending.some(lateDue)?" over":""}"><div class="dh"><span>期限まで</span><span class="num">${D.pending.length}件</span></div><ul>${D.pending.slice().sort((a,b)=>a.dueDate<b.dueDate?-1:1).map(t=>`<li style="color:${col(t.subject)}"><button class="minicheck" data-toggledue="${t.id}" data-wk="${t.dueDate}" data-date="${doneDay||t.dueDate}" aria-label="${esc(t.name)}を完了にする"></button><span class="tag sm" style="background:${col(t.subject)}">${SUBJ[t.subject].short}</span><span class="nm">${esc(t.name)}${dueLabel(t,today)}</span></li>`).join("")}</ul></div>`;
  }
  const listFor = (p, cls, label) => `<div class="dayblock ${cls}"><div class="dh"><span>${label}</span><span class="num">${p.T.todo.length?`${p.T.todo.length}件`:"完了"}</span></div>${p.T.todo.length ? `<ul>${p.T.todo.map(t=>`<li style="color:${col(t.subject)}"><button class="minicheck" data-toggle="${t.id}" data-date="${p.d}" aria-label="${esc(t.name)}を完了にする"></button><span class="tag sm" style="background:${col(t.subject)}">${SUBJ[t.subject].short}</span><span class="nm">${esc(t.name)}${t.memo?` <span class="memo">${esc(t.memo)}</span>`:""}</span></li>`).join("")}</ul>` : `<div class="allgood">すべて完了</div>`}</div>`;
  per.filter(p=>late(p) && p.T.todo.length).forEach(p=>{ h += listFor(p,"over",`未完了 ・ ${dateTitle(p.d)}`); });
  const future = per.filter(p=>p.d>=today);
  if (!future.length && !overdue && !D.pending.length) h += `<div class="empty">この週は終わりました</div>`;
  future.forEach(p=>{ h += listFor(p, p.d===today?"istoday":"", (p.d===today?"今日 ・ ":"")+dateTitle(p.d)); });

  const seen = new Map();
  per.forEach(p=>[...p.T.active,...p.T.skipped].forEach(t=>{ if(!seen.has(t.id)) seen.set(t.id,t); }));
  const rows = sortTasks([...seen.values()]);
  h += `<h2 class="sec">1週間の記録</h2><div class="gridwrap"><table class="grid"><thead><tr><th>課題</th>${dates.map(d=>`<th class="${d===today?"td":""}">${DOW[dow(d)]}<br><span class="num">${parse(d).getDate()}</span></th>`).join("")}</tr></thead><tbody>`;
  rows.forEach(t=>{
    h += `<tr><td><div class="tn"><span class="tag sm" style="background:${col(t.subject)}">${SUBJ[t.subject].short}</span><span>${esc(t.name)}</span></div></td>`;
    per.forEach(p=>{
      if (p.T.active.find(x=>x.id===t.id)){ const on=!!getDay(p.d).done[t.id]; h += `<td><button class="cell${on?" on":""}${(!on&&late(p))?" late":""}" style="color:${col(t.subject)}" data-toggle="${t.id}" data-date="${p.d}" aria-pressed="${on}" aria-label="${DOW[dow(p.d)]}曜 ${esc(t.name)}"></button></td>`; }
      else if (p.T.skipped.find(x=>x.id===t.id)) h += `<td style="color:var(--ink2);font-size:13px" title="しない">−</td>`;
      else h += `<td></td>`;
    });
    h += `</tr>`;
  });
  D.all.concat(D.skipped).forEach(t=>{
    const skipped = D.skipped.includes(t);
    h += `<tr><td><div class="tn"><span class="tag sm" style="background:${col(t.subject)}">${SUBJ[t.subject].short}</span><span>${esc(t.name)}</span></div><div class="dueonly">${DOW[t.due]}曜まで${t.doneDate?`・${md(t.doneDate)}に完了`:""}</div></td>`;
    dates.forEach(d=>{
      if (d!==t.dueDate) { h += `<td>${t.doneDate===d?`<span style="color:${col(t.subject)};font-weight:900">✓</span>`:""}</td>`; return; }
      if (skipped) { h += `<td style="color:var(--ink2);font-size:13px" title="しない">−</td>`; return; }
      const on = !!t.doneDate;
      h += `<td><button class="cell${on?" on":""}${lateDue(t)?" late":""}" style="color:${col(t.subject)}" data-toggledue="${t.id}" data-wk="${t.dueDate}" data-date="${(today>=ws&&today<=we)?today:d}" aria-pressed="${on}" aria-label="${esc(t.name)}（${DOW[t.due]}曜まで）"></button></td>`;
    });
    h += `</tr>`;
  });
  if (!rows.length && !D.all.length && !D.skipped.length) h += `<tr><td colspan="8" style="color:var(--ink2)">この週の予定はありません</td></tr>`;
  h += `</tbody><tfoot><tr><td>完了（曜日指定）</td>${per.map(p=>`<td class="num">${p.T.active.length?`${p.T.done.length}/${p.T.active.length}`:"—"}</td>`).join("")}</tr></tfoot></table></div>`;
  return h;
}

let cal = {m:todayISO().slice(0,8)+"01", a:null, b:null, g:"test"};
function calHTML(){
  const first=parse(cal.m), y=first.getFullYear(), mo=first.getMonth();
  const lastDay = iso(new Date(y,mo+1,0));
  const start = weekStartOf(cal.m,data.weekStart), end = addDays(weekStartOf(lastDay,data.weekStart),6);
  const today = todayISO(), a = cal.a, z = cal.b||cal.a;
  let cells = DORDER().map(i=>`<span class="cw">${DOW[i]}</span>`).join("");
  for (let d=start; d<=end; d=addDays(d,1)){
    const inM = parse(d).getMonth()===mo, sel = a && d>=a && d<=z, edge = d===cal.a || d===cal.b;
    const g = groupOf(d), gc = g!=="normal" ? gColor(gById(g)) : "";
    cells += `<button type="button" class="cd${inM?"":" out"}${sel?" sel":""}${edge?" edge":""}${d===today?" today":""}" data-cal="${d}" aria-pressed="${!!sel}" aria-label="${dateTitle(d)}">${parse(d).getDate()}${gc?`<i style="background:${gc}"></i>`:""}</button>`;
  }
  const lbl = cal.a ? `${md(cal.a)}（${DOW[dow(cal.a)]}）〜 ${cal.b?`${md(cal.b)}（${DOW[dow(cal.b)]}）`:"終了日をタップ"}` : "開始日をタップしてください";
  return `<div class="cal"><div class="calh"><button type="button" class="navbtn sm" data-calm="-1" aria-label="前の月">‹</button><b class="num">${y}年${mo+1}月</b><button type="button" class="navbtn sm" data-calm="1" aria-label="次の月">›</button></div>
    <div class="calg">${cells}</div><p class="calsel">${lbl}</p></div>`;
}

/* ---------- modal: task & group editor ---------- */
const modal = document.getElementById("modal");
let ed = null;
function openEd(e){ ed = e; renderEd(); }
function closeEd(){ ed = null; modal.innerHTML = ""; }
function renderEd(){
  if (!ed){ modal.innerHTML=""; return; }
  let body;
  if (ed.kind==="group"){
    const g = ed.id?gById(ed.id):null;
    const colors = ["0","1","2","3","4"];
    body = `<h3 id="ed-t">${ed.id?"スケジュールの種類を編集":"スケジュールの種類を追加"}</h3>
      <div class="field"><label for="e-name">名前</label><input type="text" id="e-name" value="${esc(ed.name)}" placeholder="例：夏期講習、冬休み、イレギュラー週" maxlength="20"></div>
      ${g&&g.builtin?"":`<div class="field"><span class="lb">色</span><div class="pickrow">${colors.map(c=>`<button type="button" class="pick" data-gcolor="${c}" aria-pressed="${ed.color===c}" style="color:var(--g-${c})"><span class="tag sm" style="background:var(--g-${c})"></span></button>`).join("")}</div></div>`}
      ${ed.id?"":`<div class="field"><label for="e-copy">課題を引き継ぐ（あとで変更できます）</label><select id="e-copy"><option value="">引き継がない（空から登録）</option>${data.groups.map(x=>`<option value="${x.id}" ${ed.copyFrom===x.id?"selected":""}>「${esc(x.name)}」と同じ課題も入れる</option>`).join("")}</select></div>`}
      <div class="btns"><button type="submit" class="btn primary grow1">保存</button><button type="button" class="btn" data-cancel>キャンセル</button></div>
      ${ed.id && !(g&&g.builtin) ? `<div class="btns"><button type="button" class="btn danger" data-delgroup>${ed.confirmDel?"本当に削除する":"この種類を削除"}</button></div>
        ${ed.confirmDel?`<p class="note">この種類に設定した週は「通常週」に戻ります。この種類だけの課題は削除されます。</p>`:""}`:""}`;
  } else {
    const isExtra = ed.kind==="extra";
    const gOpts = [...data.groups.map(g=>({id:g.id,name:g.name,color:gColor(g)})), {id:ALWAYS,name:"毎週共通",color:"var(--ink2)"}];
    body = `<h3 id="ed-t">${isExtra?(cur===todayISO()?"今日の課題を追加":`${dateTitle(cur)}の課題を追加`):ed.id?"課題を編集":"課題を追加"}</h3>
      ${isExtra?`<p class="note" style="margin:-6px 0 14px">この日だけの課題です。ほかの日や、登録済みの課題には影響しません。</p>`:""}
      <div class="field"><span class="lb">科目</span><div class="pickrow">${ORDER.map(s=>`<button type="button" class="pick" data-subj="${s}" aria-pressed="${ed.subject===s}" style="color:${col(s)};${ed.subject===s?`background:${tint(s)}`:""}"><span class="tag sm" style="background:${col(s)}">${SUBJ[s].short}</span><span style="color:var(--ink)">${SUBJ[s].name}</span></button>`).join("")}</div>${ed.subject==="life"?`<p class="note" style="margin:2px 0 0">生活の課題は、終わらなかったときも次の日に「期限切れ」として持ち越しません。</p>`:""}</div>
      <div class="field"><label for="e-name">教材名・内容</label><input type="text" id="e-name" value="${esc(ed.name)}" placeholder="例：基礎トレ、漢字の要" maxlength="40"></div>
      <div class="field"><label for="e-memo">メモ（範囲・回数など。空欄でも可）</label><input type="text" id="e-memo" value="${esc(ed.memo)}" placeholder="例：1日1ページ" maxlength="40"></div>
      ${isExtra?"":`
      <div class="field"><span class="lb">する日の決め方</span><div class="pickrow">
        <button type="button" class="pick wn" data-emode="days" aria-pressed="${ed.mode!=="due"}">曜日を決める</button>
        <button type="button" class="pick wn" data-emode="due" aria-pressed="${ed.mode==="due"}">期限を決める</button></div></div>
      ${ed.mode==="due"
        ? `<div class="field"><span class="lb">期限（この曜日までにする）</span><div class="pickrow">${DORDER().map(i=>`<button type="button" class="pick dw" data-due="${i}" aria-pressed="${ed.due===i}">${DOW[i]}</button>`).join("")}</div><p class="note" style="margin:0">前の期限の翌日から次の期限の日まで、毎日「期限まで」に表示されます。完了すると、次の回まで表示されません。</p></div>`
        : `<div class="field"><span class="lb">する日を選択</span><div class="pickrow">${DORDER().map(i=>`<button type="button" class="pick dw" data-dw="${i}" aria-pressed="${ed.days.includes(i)}">${DOW[i]}</button>`).join("")}</div></div>`}
      <div class="field"><span class="lb">どのスケジュールの週にする？（複数選択可）</span><div class="pickrow">${gOpts.map(g=>`<button type="button" class="pick wn" data-eg="${g.id}" aria-pressed="${ed.groups.includes(g.id)}"><span class="tag sm" style="background:${g.color};width:10px;height:10px"></span>${esc(g.name)}</button>`).join("")}</div></div>`}
      <div class="btns"><button type="submit" class="btn primary grow1">保存</button><button type="button" class="btn" data-cancel>キャンセル</button></div>
      ${ed.id && !isExtra ? `<div class="btns"><button type="button" class="btn danger" data-deltask>${ed.confirmDel?"本当に削除する":"この課題を削除"}</button></div>`:""}`;
  }
  modal.innerHTML = `<div class="overlay" data-close><form class="sheet" id="edform" role="dialog" aria-modal="true" aria-labelledby="ed-t">${body}</form></div>`;
}
function readEd(){ const n=document.getElementById("e-name"), m=document.getElementById("e-memo"), c=document.getElementById("e-copy"); if(n) ed.name=n.value; if(m) ed.memo=m.value; if(c) ed.copyFrom=c.value; }

modal.addEventListener("click", e=>{
  if (!ed) return;
  if (e.target.matches("[data-close]") || e.target.closest("[data-cancel]")){ closeEd(); return; }
  const b = e.target.closest("button"); if(!b) return;
  const d = b.dataset;
  if (d.subj){ readEd(); ed.subject=d.subj; renderEd(); }
  else if (d.emode){ readEd(); ed.mode=d.emode; renderEd(); }
  else if (d.due!==undefined){ readEd(); ed.due=+d.due; renderEd(); }
  else if (d.dw!==undefined){ readEd(); const i=+d.dw; ed.days = ed.days.includes(i)?ed.days.filter(x=>x!==i):[...ed.days,i]; renderEd(); }
  else if (d.eg){ readEd(); const g=d.eg;
    if (g===ALWAYS) ed.groups = ed.groups.includes(ALWAYS)?[]:[ALWAYS];
    else { ed.groups = ed.groups.filter(x=>x!==ALWAYS); ed.groups = ed.groups.includes(g)?ed.groups.filter(x=>x!==g):[...ed.groups,g]; }
    renderEd(); }
  else if (d.gcolor){ readEd(); ed.color=d.gcolor; renderEd(); }
  else if (b.matches("[data-deltask]")){
    if (!ed.confirmDel){ readEd(); ed.confirmDel=true; renderEd(); return; }
    data.tasks = data.tasks.filter(x=>x.id!==ed.id); closeEd(); commit(); toast("削除しました");
  }
  else if (b.matches("[data-delgroup]")){
    if (!ed.confirmDel){ readEd(); ed.confirmDel=true; renderEd(); return; }
    const gid = ed.id;
    data.groups = data.groups.filter(g=>g.id!==gid);
    Object.keys(data.weekGroups).forEach(k=>{ if(data.weekGroups[k]===gid) delete data.weekGroups[k]; });
    data.tasks = data.tasks.filter(t=>{ t.groups=t.groups.filter(x=>x!==gid); return t.groups.length>0; });
    if (setTab===gid) setTab="normal";
    closeEd(); commit(); toast("削除しました");
  }
});
modal.addEventListener("submit", e=>{
  e.preventDefault(); readEd();
  const name = (ed.name||"").trim(); if(!name){ toast("名前を入力してください"); return; }
  if (ed.kind==="group"){
    if (ed.id){ const g=gById(ed.id); g.name=name; if(!g.builtin) g.color=ed.color; }
    else {
      const id = uid("g"); data.groups.push({id,name,color:ed.color});
      if (ed.copyFrom) data.tasks.forEach(t=>{ if(t.groups.includes(ed.copyFrom)) t.groups.push(id); });
      setTab = id;
    }
    closeEd(); commit(); toast("保存しました"); return;
  }
  if (ed.kind==="extra"){ dayRef(cur).extra.push({id:uid("x"),subject:ed.subject,name,memo:(ed.memo||"").trim()}); closeEd(); commit(); toast("追加しました"); return; }
  if (ed.mode==="due" ? (ed.due===undefined||ed.due===null) : !ed.days.length){ toast(ed.mode==="due"?"期限の曜日を選んでください":"する日を1つ以上選んでください"); return; }
  if (!ed.groups.length){ toast("スケジュールを1つ以上選んでください"); return; }
  const item = {id:ed.id||uid(), subject:ed.subject, name, memo:(ed.memo||"").trim(), mode:ed.mode==="due"?"due":"days", days:ed.mode==="due"?[]:ed.days.slice().sort((a,b)=>a-b), groups:ed.groups.slice()};
  if (item.mode==="due") item.due = ed.due;
  const i = data.tasks.findIndex(x=>x.id===item.id);
  if (i>=0) data.tasks[i]=item; else data.tasks.push(item);
  closeEd(); commit(); toast("保存しました");
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && ed) closeEd(); });

/* ---------- main events ---------- */
function onClick(e){
  const b = e.target.closest("button"); if(!b) return;
  const d = b.dataset;
  if (d.reset===undefined && confirmKey){ confirmKey=null; }
  if (d.view){ view=d.view; openMore=null; try{localStorage.setItem(KEY+"-view",view);}catch(_){}; render(); window.scrollTo(0,0); return; }
  if (d.toggle){ const date=d.date||cur, today=todayISO(); const r=dayRef(date); r.done[d.toggle] = r.done[d.toggle] ? false : (date<=today ? today : date); commit(); return; }
  if (d.more){ openMore = openMore===d.more?null:d.more; render(); return; }
  if (d.toggledue){ const w=dueRef(d.wk); if (w.done[d.toggledue]) delete w.done[d.toggledue]; else w.done[d.toggledue]=d.date||todayISO(); commit(); return; }
  if (d.skipweek){ openMore=null; const w=dueRef(d.ws); if(!w.skip.includes(d.skipweek)) w.skip.push(d.skipweek); commit(); toast("今週はしないことにしました"); return; }
  if (d.unskipweek){ const w=dueRef(d.ws); w.skip=w.skip.filter(x=>x!==d.unskipweek); commit(); return; }
  if (d.skip){ openMore=null; const r=dayRef(d.sdate||cur); if(!r.skip.includes(d.skip)) r.skip.push(d.skip); commit(); toast("しないことにしました"); return; }
  if (d.unskip){ const r=dayRef(cur); r.skip=r.skip.filter(x=>x!==d.unskip); commit(); return; }
  if (d.delextra){ openMore=null; const r=dayRef(d.sdate||cur); r.extra=r.extra.filter(x=>x.id!==d.delextra); commit(); return; }
  if (d.day){ cur=addDays(cur,+d.day); openMore=null; render(); return; }
  if (d.week){ cur=addDays(cur,7*(+d.week)); render(); return; }
  if (d.gotoday!==undefined){ cur=todayISO(); render(); return; }
  if (d.addextra!==undefined){ openEd({kind:"extra",subject:"math",name:"",memo:""}); return; }
  if (d.settab){ setTab=d.settab; render(); return; }
  if (d.new!==undefined){ openEd({kind:"task",subject:setTab===ALWAYS?"life":"math",name:"",memo:"",mode:"days",days:[],due:null,groups:[setTab]}); return; }
  if (d.edit){ const t=data.tasks.find(x=>x.id===d.edit); if(t) openEd(Object.assign({kind:"task",memo:""},clone(t))); return; }
  if (d.newgroup!==undefined){ openEd({kind:"group",name:"",color:String(data.groups.filter(g=>!g.builtin).length%5),copyFrom:""}); return; }
  if (d.editgroup){ const g=gById(d.editgroup); openEd({kind:"group",id:g.id,name:g.name,color:g.color}); return; }
  if (d.moreweeks!==undefined){ weeksShown+=12; render(); return; }
  if (d.calm){ const f=parse(cal.m); cal.m=iso(new Date(f.getFullYear(),f.getMonth()+(+d.calm),1)); render(); return; }
  if (d.cal){ const x=d.cal; if(!cal.a || cal.b){ cal.a=x; cal.b=null; } else if (x<cal.a){ cal.a=x; } else { cal.b=x; } render(); return; }
  if (d.install!==undefined){ if(installEvt){ installEvt.prompt(); installEvt.userChoice.finally(()=>{ installEvt=null; render(); }); } return; }
  if (d.applyrange!==undefined){
    const g=document.getElementById("r-group").value;
    if(!cal.a){ toast("カレンダーで開始日をタップしてください"); return; }
    const a = cal.a, z = cal.b||cal.a; let n=0;
    for (let ws=weekStartOf(a,data.weekStart); ws<=z; ws=addDays(ws,7)){ if(g==="normal") delete data.weekGroups[ws]; else data.weekGroups[ws]=g; n++; }
    cal.a=null; cal.b=null; cal.g=g;
    commit(); toast(`${n}週を「${gById(g).name}」にしました`); return;
  }
  if (d.wstart!==undefined){ const nw=+d.wstart; if(nw!==data.weekStart){ const m={}; Object.keys(data.weekGroups).forEach(k=>{ m[weekStartOf(addDays(k,3),nw)]=data.weekGroups[k]; }); data.weekGroups=m; data.weekStart=nw; commit(); } return; }
  if (d.seed){ data = d.seed==="sample"?sampleData():blankData(); data.startISO=todayISO(); if(d.seed==="blank") view="settings"; commit(); return; }
  if (d.export!==undefined){ exportData(); return; }
  if (d.import!==undefined){ document.getElementById("importFile").click(); return; }
  if (d.reset!==undefined){
    if (confirmKey!=="reset"){ confirmKey="reset"; render(); return; }
    confirmKey=null; data=null; try{ localStorage.removeItem(KEY); }catch(_){}; render(); return;
  }
}
main.addEventListener("click", onClick);
document.getElementById("tabs").addEventListener("click", onClick);
main.addEventListener("change", e=>{
  const t = e.target;
  if (t.id==="f-child"){ data.childName=t.value.trim(); commit(); }
  else if (t.id==="r-group"){ cal.g=t.value; }
  else if (t.dataset.weekgroup){ const ws=t.dataset.weekgroup; if(t.value==="normal") delete data.weekGroups[ws]; else data.weekGroups[ws]=t.value; t.blur(); commit(); }
});

/* ---------- backup ---------- */
async function exportData(){
  const name = `宿題手帳_バックアップ_${todayISO()}.json`;
  const json = JSON.stringify(Object.assign({app:"shukudai-techo",version:2,savedAt:new Date().toISOString()},data,{lastBackupISO:todayISO()}),null,1);
  const blob = new Blob([json],{type:"application/json"});
  const done = ()=>{ data.lastBackupISO = todayISO(); persist(); render(); toast("バックアップを保存しました"); };
  try {
    const file = new File([blob], name, {type:"application/json"});
    if (navigator.canShare && navigator.canShare({files:[file]})) {
      await navigator.share({files:[file], title:"宿題手帳のバックアップ"});
      return done();
    }
  } catch(err) { if (err && err.name==="AbortError") { toast("保存をやめました"); return; } }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  done();
}
document.getElementById("importFile").addEventListener("change", e=>{
  const f = e.target.files && e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const j = JSON.parse(r.result);
      if (!j || !Array.isArray(j.tasks)) throw new Error("bad");
      delete j.app; delete j.version; delete j.savedAt;
      data = normalize(j); commit(); toast("復元しました");
    }catch(err){ toast("このファイルは読み込めませんでした"); }
    e.target.value = "";
  };
  r.readAsText(f);
});

let toastT;
function toast(msg){ const el=document.getElementById("toast"); el.textContent=msg; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{el.hidden=true;},2400); }

/* 日付が変わったら「今日」を更新 */
let lastToday = todayISO();
setInterval(()=>{ const t=todayISO(); if(t!==lastToday){ if(cur===lastToday) cur=t; lastToday=t; if(!ed) render(); } }, 60000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden){ const t=todayISO(); if(t!==lastToday){ if(cur===lastToday) cur=t; lastToday=t; } if(!ed) render(); } });

/* ---------- boot ---------- */
data = load();
try { const v = localStorage.getItem(KEY+"-view"); if (v==="today"||v==="week"||v==="settings") view = v; } catch(e){}
render();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
if (onWeb && "serviceWorker" in navigator) { window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }); }
})();
</script>
